name: Feature Request
description: Suggest a new feature or improvement for Shoyz Tools
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature!
        Please describe your idea in detail.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this feature solve? What would you like to be able to do?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of any alternative solutions or workarounds?
      placeholder: I tried X, but it doesn't work because...

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which part of the plugin does this relate to?
      options:
        - Badge Management
        - OSINT Tools
        - UI Customization
        - Moderation Tools
        - Per-Server Settings
        - Quick Actions
        - Export/Import
        - Other
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockups or Examples
      description: If applicable, add mockups, sketches, or examples from other apps.
      placeholder: Drag and drop images here or paste URLs

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information or context about the feature request.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and this feature hasn't been requested before
          required: true
        - label: This feature would be useful to other users, not just me
          required: true
        - label: This feature aligns with the plugin's goals (badge management, OSINT, UI customization, moderation)
          required: true
