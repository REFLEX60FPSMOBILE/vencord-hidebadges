name: Bug Report
description: Report a bug or issue with Shoyz Tools
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please provide as much detail as possible to help us fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click X, Y happens instead of Z...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to Settings > Vencord > Plugins > Shoyz Tools
        2. Click on 'Badge List' tab
        3. Search for 'Nitro'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: The badge should be hidden...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: The badge is still visible...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop images here or paste URLs

  - type: input
    id: vencord-version
    attributes:
      label: Vencord Version
      description: What version of Vencord are you using?
      placeholder: "e.g., 1.8.0"
    validations:
      required: true

  - type: input
    id: discord-version
    attributes:
      label: Discord Version
      description: What version of Discord are you using?
      placeholder: "e.g., Stable 293847 (abcdef1)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser / Discord Client
      description: Which Discord client are you using?
      options:
        - Discord Desktop (Windows)
        - Discord Desktop (macOS)
        - Discord Desktop (Linux)
        - Discord Web (Chrome/Chromium)
        - Discord Web (Firefox)
        - Discord Web (Safari)
        - Discord Web (Other)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information that might be relevant.
      placeholder: This started happening after...

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am using the latest version of Shoyz Tools
          required: true
        - label: I have disabled other plugins to isolate the issue
          required: false
